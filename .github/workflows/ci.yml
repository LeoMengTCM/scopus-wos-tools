name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff
      - name: Lint
        run: ruff check src/ scripts/ tests/ run_ai_workflow.py gui_app.py
      - name: Tests
        run: python -m unittest discover tests -v
      - name: Smoke run (no AI)
        run: python run_ai_workflow.py --data-dir Example --no-ai
